[project]
name = "bden"
version = "0.1.0"
description = "image denoising with classic and neural-guided bilateral filters"
requires-python = ">=3.12,<3.13"
dependencies = [
  "labcore",
  "torch>=2.5",
  "numpy>=1.26",
  "opencv-python-headless>=4.10",
  "scikit-image>=0.24",
  "pillow>=10",
  "onnx>=1.17",
  "onnxruntime>=1.20",
  "huggingface-hub>=0.26",
  "matplotlib>=3.9",
  "tqdm>=4.66",
  "lmdb>=3.0.0",
  "scipy>=1.18.1",
]

[project.optional-dependencies]
ref = ["bm3d>=4.0"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bden"]

[tool.uv.sources]
labcore = { path = "../../packages/labcore", editable = true }
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
