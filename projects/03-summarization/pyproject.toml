[project]
name = "summ"
version = "0.1.0"
description = "abstractive summarization on CNN/DailyMail with a browser-sized bart, length control and factuality checks"
requires-python = ">=3.12,<3.13"
dependencies = [
  "labcore",
  "torch>=2.5",
  "transformers>=4.46,<5",
  "datasets>=3.0,<4",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "networkx>=3.3",
  "nltk>=3.9",
  "rouge-score>=0.1.2",
  "bert-score>=0.3.13",
  "safetensors>=0.4",
  "huggingface-hub>=0.26",
  "onnx>=1.17",
  "onnxruntime>=1.20",
  "matplotlib>=3.9",
  "tqdm>=4.66",
  "optimum[onnxruntime]>=1.23",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/summ"]

[tool.uv.sources]
labcore = { path = "../../packages/labcore", editable = true }
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
