[project]
name = "emo"
version = "0.1.0"
description = "multi-label emotion classification on GoEmotions, distilled for the browser"
requires-python = ">=3.12,<3.13"
dependencies = [
  "labcore",
  "torch>=2.5",
  "transformers>=4.46",
  "datasets>=3.0",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "safetensors>=0.4",
  "huggingface-hub>=0.26",
  "onnx>=1.17",
  "onnxruntime>=1.20",
  "matplotlib>=3.9",
  "tqdm>=4.66",
]

[project.optional-dependencies]
export = ["optimum[onnxruntime]>=1.23"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emo"]

[tool.uv.sources]
labcore = { path = "../../packages/labcore", editable = true }
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
